    flex-wrap: wrap;
  }

  }

<body>

<h1>Hex Map Palette Experiment</h1>
<p class="subtitle">Comparing the current palette against parchment-world alternatives</p>

<div class="section-divider">— Current vs Parchment —</div>

<div class="palette-row" id="row1"></div>

<div class="section-divider">— Additional Explorations —</div>

<div class="palette-row" id="row2"></div>

<script>
// ── Hex geometry ──
const HEX_SIZE = 16;
const COLS = 16, ROWS = 12;
const sqrt3 = Math.sqrt(3);

function hexToPixel(col, row) {
  const x = HEX_SIZE * sqrt3 * (col + 0.5 * (row & 1));
  const y = HEX_SIZE * 1.5 * row;
  return { x: x + 30, y: y + 28 };
}

function drawHex(ctx, cx, cy, size, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + size * Math.cos(angle);
    const y = cy + size * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.6; ctx.stroke(); }
}

// ── Terrain layout (repeatable pseudo-random from position) ──
function terrainAt(col, row, seed) {
  let h = (col * 374761 + row * 668265 + seed) & 0xFFFFFF;
  h = ((h >> 8) ^ h) * 1103515245;
  return ((h & 0x7FFFFFFF) % 1000) / 1000;
}

function pickTerrain(val) {
  // Returns a terrain category index
  if (val < 0.02) return 'deep_water';
  if (val < 0.08) return 'water';
  if (val < 0.14) return 'shallows';
  if (val < 0.22) return 'marsh';
  if (val < 0.38) return 'grassland';
  if (val < 0.48) return 'forest_light';
  if (val < 0.56) return 'forest_dense';
  if (val < 0.62) return 'savanna';
  if (val < 0.70) return 'hills';
  if (val < 0.76) return 'desert';
  if (val < 0.82) return 'mountains';
  if (val < 0.88) return 'high_mountains';
  if (val < 0.92) return 'tundra';
  if (val < 0.96) return 'volcanic';
  return 'snow';
}

// ── Palettes ──
const PALETTES = {

    bg: '#0a0a0c',
    grid: '#5D5E66',
    label_bg: '#111114',
    notes: 'Saturated greens and earth tones on a near-black abyss. High contrast between terrain and void. Magic threads pop against darkness.',
    colors: {
      deep_water: '#366A98',
      water: '#4886B0',
      shallows: '#6AA2C0',
      marsh: '#8E905A',
      grassland: '#9CA85C',
      forest_light: '#849A52',
      forest_dense: '#4C6436',
      savanna: '#B4A654',
      hills: '#C0A05A',
      desert: '#CEAE72',
      mountains: '#A47A3C',
      high_mountains: '#908680',
      tundra: '#E2DCD0',
      volcanic: '#884C38',
      snow: '#DAD4C8',
    }
  },

  parchment_warm: {
    name: 'Aged Parchment',
    tag: 'experiment',
    bg: '#2a2318',
    grid: '#4a3f30',
    label_bg: '#1e1a12',
    notes: 'Old browned parchment. Everything desaturated into sepia/umber range. Water is ink-wash blue-grey. Terrain differences come from value (light/dark) rather than hue. Feels like an ancient hand-drawn map.',
    colors: {
      deep_water: '#3a4550',
      water: '#4d5a65',
      shallows: '#697a84',
      marsh: '#7a7258',
      grassland: '#a09470',
      forest_light: '#8a7d5e',
      forest_dense: '#5c5240',
      savanna: '#b09a6a',
      hills: '#c4a870',
      desert: '#d4b87a',
      mountains: '#8a7050',
      high_mountains: '#7a7068',
      tundra: '#d0c4a8',
      volcanic: '#6a4a3a',
      snow: '#c8bca0',
    }
  },

  parchment_cool: {
    name: 'Faded Vellum',
    tag: 'experiment',
    bg: '#1e1c18',
    grid: '#3a3830',
    label_bg: '#16140f',
    notes: 'Cooler, more faded parchment — like a map left in daylight for centuries. Greens are olive-grey, water is cold steel-blue. More muted than Aged Parchment. Think weathered manuscript, not warm candlelit map.',
    colors: {
      deep_water: '#384858',
      water: '#4a5e6e',
      shallows: '#607880',
      marsh: '#6a6858',
      grassland: '#8a8468',
      forest_light: '#787460',
      forest_dense: '#505040',
      savanna: '#989070',
      hills: '#a89870',
      desert: '#b8a878',
      mountains: '#787060',
      high_mountains: '#686460',
      tundra: '#c0b8a0',
      volcanic: '#584038',
      snow: '#b8b098',
    }
  },

  ink_wash: {
    name: 'Ink & Wash',
    tag: 'experiment',
    bg: '#141210',
    grid: '#2e2a24',
    label_bg: '#0e0d0a',
    notes: 'Near-monochrome sepia ink wash. Terrain is almost all warm greys and browns with minimal color. Water stands out as the only cool tone. Maximum "old document" feel — like a medieval cartographer\'s working sketch.',

    notes: 'Parchment palette but keeping the dark STYLE.md aesthetic — value range 15-45% brightness. Terrain reads as burnt, aged earth against near-black void. Magic threads would still glow bright against this. Best of both worlds?',
    colors: {
      deep_water: '#1e2e3a',
      water: '#2a3e4c',
      shallows: '#3a5060',

    colors: {

      water: '#344558',
      shallows: '#486070',
      marsh: '#585248',
      grassland: '#7a7058',
      forest_light: '#686050',
      forest_dense: '#3e3830',
      savanna: '#887850',
      hills: '#947c4c',
      desert: '#a08848',
      mountains: '#5a4e40',

// ── Rendering ──
function renderPalette(canvasId, paletteKey) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 440 * dpr;
  canvas.height = 340 * dpr;
  ctx.scale(dpr, dpr);

  const p = PALETTES[paletteKey];
  ctx.fillStyle = p.bg;
  ctx.fillRect(0, 0, 440, 340);

  const seed = 42;

  // Draw hexes
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const { x, y } = hexToPixel(c, r);
      const val = terrainAt(c, r, seed);
      const terrain = pickTerrain(val);
      const color = p.colors[terrain];
      drawHex(ctx, x, y, HEX_SIZE - 0.5, color, p.grid);
    }
  }

  // Draw a couple of "roads" as thin lines to show how roads look against each palette
  ctx.strokeStyle = paletteKey === 'current' ? '#6b5a40' : '#5a4a30';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath();
  const roadPath = [[3,2],[4,3],[5,3],[6,4],[7,4],[8,5],[9,5],[10,5]];
  roadPath.forEach((p, i) => {
    const { x, y } = hexToPixel(p[0], p[1]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Draw a "river" as a blue-ish line
  ctx.strokeStyle = p.colors.shallows;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  const riverPath = [[1,6],[2,7],[3,7],[4,8],[5,8],[6,9],[7,9],[8,10]];
  riverPath.forEach((pt, i) => {
    const { x, y } = hexToPixel(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Add a subtle magic thread (gold glow) to show contrast
  ctx.save();
  ctx.strokeStyle = '#d4a040';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#d4a040';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  const threadPath = [[10,1],[11,2],[12,2],[13,3],[13,4],[12,5]];
  threadPath.forEach((pt, i) => {
    const { x, y } = hexToPixel(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  // bright node
  const node = hexToPixel(12, 2);
  ctx.beginPath();
  ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe88a';
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#d4a040';
  ctx.fill();
  ctx.restore();

  // Another thread — green life magic
  ctx.save();
  ctx.strokeStyle = '#33ff77';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#00cc55';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  const lifeThread = [[6,1],[7,2],[7,3],[8,4]];
  lifeThread.forEach((pt, i) => {
    const { x, y } = hexToPixel(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}

function createCard(containerId, paletteKey) {
  const p = PALETTES[paletteKey];
  const container = document.getElementById(containerId);
  const card = document.createElement('div');
  card.className = 'palette-card';

  const canvasId = 'canvas-' + paletteKey;
  const tagClass = p.tag === 'current' ? 'tag-current' : 'tag-experiment';

  card.innerHTML = `
    <div class="palette-label" style="background:${p.label_bg}">
      ${p.name}
      <span class="tag ${tagClass}">${p.tag}</span>
    </div>
    <canvas id="${canvasId}"></canvas>
    <div class="swatch-row">
      ${Object.entries(p.colors).map(([k, c]) =>
        `<div class="swatch" style="background:${c}" title="${k}: ${c}"></div>`
      ).join('')}
    </div>
    <div class="notes">${p.notes}</div>
  `;
  container.appendChild(card);

  requestAnimationFrame(() => renderPalette(canvasId, paletteKey));
}

// Row 1: Current vs main parchment
createCard('row1', 'current');
createCard('row1', 'parchment_warm');

// Row 2: Variations
createCard('row2', 'parchment_cool');
createCard('row2', 'ink_wash');
createCard('row2', 'threadbare_dark');
createCard('row2', 'twilight_parchment');
</script>
