<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impediment Dashboard — The Fantasy World Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 2rem; min-height: 100vh; }
  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.3rem; margin: 2rem 0 1rem; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
  .muted { color: #94a3b8; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
  .header-left h1 { color: #e2e8f0; }
  .header-right { display: flex; gap: 1.5rem; }
  .stat-card { background: #16213e; border-radius: 8px; padding: 1rem 1.5rem; text-align: center; min-width: 120px; }
  .stat-card .value { font-size: 2rem; font-weight: 700; }
  .stat-card .label { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; }
  .stat-card.hot .value { color: #e94560; }
  .stat-card.warn .value { color: #f59e0b; }
  .stat-card.ok .value { color: #10b981; }

  .alert-card { background: #16213e; border-left: 4px solid #10b981; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; }
  .alert-card.hot { border-left-color: #e94560; }
  .alert-card.warn { border-left-color: #f59e0b; }
  .alert-card .title { font-weight: 600; margin-bottom: 0.25rem; }
  .alert-card .desc { color: #94a3b8; font-size: 0.9rem; }

  table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 8px; overflow: hidden; }
  th { background: #0f3460; color: #e2e8f0; text-align: left; padding: 0.75rem 1rem; cursor: pointer; user-select: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
  th:hover { background: #1a4a7a; }
  th.sorted-asc::after { content: ' \u25B2'; }
  th.sorted-desc::after { content: ' \u25BC'; }
  td { padding: 0.6rem 1rem; border-top: 1px solid #1a1a2e; font-size: 0.9rem; vertical-align: top; }
  tr:hover td { background: #1a2744; }

  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .badge-s { background: #064e3b; color: #6ee7b7; }
  .badge-m { background: #78350f; color: #fbbf24; }
  .badge-l { background: #7c2d12; color: #fb923c; }
  .badge-blocked { background: #7f1d1d; color: #fca5a5; }
  .badge-yes { background: #064e3b; color: #6ee7b7; }
  .badge-no { background: #7f1d1d; color: #fca5a5; }

  .cat-bar-container { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  .cat-label { width: 160px; text-align: right; font-size: 0.9rem; color: #94a3b8; }
  .cat-bar { height: 24px; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 0.8rem; font-weight: 600; min-width: 30px; }

  .impact-grid { display: flex; gap: 1rem; flex-wrap: wrap; }
  .impact-card { background: #16213e; border-radius: 8px; padding: 1rem 1.5rem; flex: 1; min-width: 120px; text-align: center; }
  .impact-card .count { font-size: 1.8rem; font-weight: 700; }
  .impact-card .lbl { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; }

  .timeline-item { background: #16213e; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 0.75rem; display: flex; gap: 1rem; align-items: flex-start; }
  .timeline-date { color: #94a3b8; font-size: 0.85rem; min-width: 90px; padding-top: 2px; }
  .timeline-content .title { font-weight: 600; margin-bottom: 0.25rem; }
  .timeline-content .meta { color: #94a3b8; font-size: 0.85rem; }

  .section-empty { color: #94a3b8; font-style: italic; padding: 1rem; }
</style>
</head>
<body>

<script>
const DATA = [
  {
    id: 1, count: 1, date: "2026-03-21", category: "tool-failure",
    description: "Claude Preview preview_screenshot times out on WebGL canvas (Three.js 60K hex render). Headless browser WebGL compositing too slow for screenshot capture.",
    consequence: "Had to switch to Playwright MCP for screenshots.",
    impact: "M", workaroundFound: true,
    workaround: "Use mcp__playwright__browser_take_screenshot instead of preview_screenshot for WebGL content.",
    session: "Phase 01 verification"
  },
  {
    id: 2, count: 1, date: "2026-03-21", category: "api-quirk",
    description: "d3-zoom default wheel handler assumes standard screen-to-data coordinate mapping. Our syncCameraToZoom uses non-standard mapping. Default zoom-toward-cursor math silently produces wrong results.",
    consequence: "Zoom toward cursor appeared broken. Required full manual wheel handling with correct math.",
    impact: "M", workaroundFound: true,
    workaround: "Handle ALL wheel events manually with correct zoom-toward-point math derived from our custom coordinate mapping.",
    session: "Phase 01 verification"
  },
  {
    id: 3, count: 1, date: "2026-03-21", category: "api-quirk",
    description: "ResizeObserver callback in HexMapV2 called resizeHexScene which reset camera frustum to origin, overwriting d3-zoom's centered camera transform. Race condition.",
    consequence: "Grid appeared in bottom-right corner instead of centered.",
    impact: "M", workaroundFound: true,
    workaround: "resizeHexScene now only updates renderer size. Caller re-syncs d3-zoom transform via syncCameraToZoom after resize.",
    session: "Phase 01 verification"
  }
];

const IMPACT_MINUTES = { S: 1, M: 8, L: 20, Blocked: 30 };
const IMPACT_COLORS = { S: '#10b981', M: '#f59e0b', L: '#fb923c', Blocked: '#e94560' };
const CAT_COLORS = {
  'tool-failure': '#e94560',
  'api-quirk': '#f59e0b',
  'permission': '#8b5cf6',
  'environment': '#06b6d4',
  'skill-gap': '#ec4899',
  'process-friction': '#f97316',
  'dependency': '#6366f1',
  'unclear-requirements': '#14b8a6',
  'flaky-test': '#a855f7',
  'other': '#64748b'
};

function impactBadge(impact) {
  return '<span class="badge badge-' + impact.toLowerCase() + '">' + impact + '</span>';
}
function workaroundBadge(found) {
  return found ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>';
}

const totalItems = DATA.length;
const totalOccurrences = DATA.reduce(function(s, d) { return s + d.count; }, 0);
const hotItems = DATA.filter(function(d) { return d.count > 3; });
const unresolvedItems = DATA.filter(function(d) { return !d.workaroundFound; });

const impactDist = {};
DATA.forEach(function(d) { impactDist[d.impact] = (impactDist[d.impact] || 0) + d.count; });
const totalMinutes = DATA.reduce(function(s, d) { return s + (IMPACT_MINUTES[d.impact] || 0) * d.count; }, 0);
const hours = Math.floor(totalMinutes / 60);
const mins = totalMinutes % 60;
const timeLost = hours > 0 ? hours + 'h ' + mins + 'm' : mins + 'm';

const catCounts = {};
DATA.forEach(function(d) {
  if (!catCounts[d.category]) catCounts[d.category] = { items: 0, occurrences: 0 };
  catCounts[d.category].items++;
  catCounts[d.category].occurrences += d.count;
});
const maxCatOcc = Math.max.apply(null, Object.values(catCounts).map(function(c) { return c.occurrences; }));

function render() {
  var html = '';

  // Header
  html += '<div class="header">';
  html += '<div class="header-left"><h1>Impediment Dashboard</h1>';
  html += '<div class="muted">The Fantasy World Simulator \u2014 ' + new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + '</div></div>';
  html += '<div class="header-right">';
  html += '<div class="stat-card ok"><div class="value">' + totalItems + '</div><div class="label">Impediments</div></div>';
  html += '<div class="stat-card ok"><div class="value">' + totalOccurrences + '</div><div class="label">Occurrences</div></div>';
  html += '<div class="stat-card ' + (totalMinutes > 120 ? 'hot' : totalMinutes > 60 ? 'warn' : 'ok') + '"><div class="value">~' + timeLost + '</div><div class="label">Est. Time Lost</div></div>';
  html += '</div></div>';

  // Hot items
  if (hotItems.length > 0) {
    html += '<h2>Hot Items (count > 3)</h2>';
    hotItems.forEach(function(d) {
      html += '<div class="alert-card ' + (d.count > 5 ? 'hot' : 'warn') + '">';
      html += '<div class="title">#' + d.id + ' \u2014 ' + d.category + ' (\u00D7' + d.count + ')</div>';
      html += '<div class="desc">' + d.description + '</div></div>';
    });
  } else {
    html += '<h2>Hot Items</h2>';
    html += '<div class="alert-card"><div class="desc">No hot items \u2014 all impediments have count \u2264 3. Nice.</div></div>';
  }

  // Table
  html += '<h2>All Impediments</h2>';
  html += '<table id="mainTable"><thead><tr>';
  html += '<th data-col="id">#</th><th data-col="count">Count</th><th data-col="date">Date</th>';
  html += '<th data-col="category">Category</th><th data-col="description">Description</th>';
  html += '<th data-col="impact">Impact</th><th data-col="workaroundFound">Workaround?</th>';
  html += '<th data-col="session">Session</th></tr></thead><tbody>';
  DATA.forEach(function(d) {
    html += '<tr><td>' + d.id + '</td><td>' + d.count + '</td><td>' + d.date + '</td>';
    html += '<td>' + d.category + '</td><td>' + d.description + '</td>';
    html += '<td>' + impactBadge(d.impact) + '</td><td>' + workaroundBadge(d.workaroundFound) + '</td>';
    html += '<td>' + d.session + '</td></tr>';
  });
  html += '</tbody></table>';

  // Category breakdown
  html += '<h2>Category Breakdown</h2>';
  var sortedCats = Object.entries(catCounts).sort(function(a, b) { return b[1].occurrences - a[1].occurrences; });
  sortedCats.forEach(function(entry) {
    var cat = entry[0], v = entry[1];
    var width = Math.max(v.occurrences / maxCatOcc * 400, 40);
    html += '<div class="cat-bar-container"><div class="cat-label">' + cat + '</div>';
    html += '<div class="cat-bar" style="width:' + width + 'px;background:' + (CAT_COLORS[cat] || '#64748b') + ';">' + v.items + ' (\u00D7' + v.occurrences + ')</div></div>';
  });

  // Impact distribution
  html += '<h2>Impact Distribution</h2><div class="impact-grid">';
  ['S', 'M', 'L', 'Blocked'].forEach(function(level) {
    var labels = { S: ' (~1m)', M: ' (~8m)', L: ' (~20m)', Blocked: ' (~30m)' };
    html += '<div class="impact-card"><div class="count" style="color:' + IMPACT_COLORS[level] + '">' + (impactDist[level] || 0) + '</div>';
    html += '<div class="lbl">' + level + labels[level] + '</div></div>';
  });
  html += '</div>';

  // Timeline
  html += '<h2>Timeline (Most Recent First)</h2>';
  var sorted = DATA.slice().sort(function(a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
  sorted.forEach(function(d) {
    var shortDesc = d.description.length > 80 ? d.description.slice(0, 80) + '\u2026' : d.description;
    html += '<div class="timeline-item"><div class="timeline-date">' + d.date + '</div>';
    html += '<div class="timeline-content"><div class="title">#' + d.id + ' ' + shortDesc + '</div>';
    html += '<div class="meta">' + d.category + ' \u00B7 ' + impactBadge(d.impact) + ' \u00B7 ' + workaroundBadge(d.workaroundFound) + '</div></div></div>';
  });

  // Unresolved
  if (unresolvedItems.length > 0) {
    html += '<h2>Unresolved (No Workaround)</h2>';
    unresolvedItems.forEach(function(d) {
      html += '<div class="alert-card hot"><div class="title">#' + d.id + ' \u2014 ' + d.category + ' (\u00D7' + d.count + ')</div>';
      html += '<div class="desc">' + d.description + '<br><em>Consequence: ' + d.consequence + '</em></div></div>';
    });
  } else {
    html += '<h2>Unresolved</h2>';
    html += '<div class="alert-card"><div class="desc">All impediments have workarounds. Zero unresolved.</div></div>';
  }

  document.body.innerHTML = html;

  // Sortable table headers
  var sortCol = null, sortDir = 'asc';
  document.querySelectorAll('#mainTable th').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.dataset.col;
      if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortCol = col; sortDir = 'asc'; }
      document.querySelectorAll('#mainTable th').forEach(function(t) { t.classList.remove('sorted-asc', 'sorted-desc'); });
      th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      var s = DATA.slice().sort(function(a, b) {
        var va = a[col], vb = b[col];
        if (typeof va === 'number') return sortDir === 'asc' ? va - vb : vb - va;
        if (typeof va === 'boolean') return sortDir === 'asc' ? (va ? 1 : -1) : (vb ? 1 : -1);
        return sortDir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
      });
      var tbody = document.querySelector('#mainTable tbody');
      var rows = '';
      s.forEach(function(d) {
        rows += '<tr><td>' + d.id + '</td><td>' + d.count + '</td><td>' + d.date + '</td>';
        rows += '<td>' + d.category + '</td><td>' + d.description + '</td>';
        rows += '<td>' + impactBadge(d.impact) + '</td><td>' + workaroundBadge(d.workaroundFound) + '</td>';
        rows += '<td>' + d.session + '</td></tr>';
      });
      tbody.innerHTML = rows;
    });
  });
}

render();
</script>

</body>
</html>
