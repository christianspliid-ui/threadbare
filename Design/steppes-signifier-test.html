<!DOCTYPE html>
<html><head><title>Steppes Signifier Test</title>
<style>
body { background: #444; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
.test { display: flex; flex-direction: column; align-items: center; gap: 4px; }
canvas { border: 1px solid #666; }
label { color: white; font: 12px monospace; }
</style></head><body>
<script>
const mainD = ;
const clipD = ;

function drawTest(label, size, useClip, opacity) {
  const div = document.createElement('div');
  div.className = 'test';
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  const vbX = 24.195, vbY = 165.763, vbW = 91.824, vbH = 82.813;
  const uniformScale = size / Math.max(vbW, vbH);
  const offsetX = (size - vbW * uniformScale) / 2;
  const offsetY = (size - vbH * uniformScale) / 2;
  
  ctx.save();
  ctx.translate(offsetX - vbX * uniformScale, offsetY - vbY * uniformScale);
  ctx.scale(uniformScale, uniformScale);
  
  if (useClip) ctx.clip(new Path2D(clipD));
  
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#1a1a1a';
  ctx.fill(new Path2D(mainD));
  ctx.restore();
  
  div.appendChild(canvas);
  const lbl = document.createElement('label');
  lbl.textContent = label;
  div.appendChild(lbl);
  document.body.appendChild(div);
}

drawTest('128px full (no clip)', 128, false, 0.55);
drawTest('128px clipped', 128, true, 0.55);
drawTest('256px full', 256, false, 0.55);
drawTest('256px clipped', 256, true, 0.55);
drawTest('512px full', 512, false, 0.55);
drawTest('512px clipped', 512, true, 0.55);
</script></body></html>
