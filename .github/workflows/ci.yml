name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'code' is true if ANY changed file is not a doc.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!Docs/**'
              - '!.planning/**'
              - '!Design/**'

  check:
    name: Test · Typecheck · Build
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Process lint (advisory)
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: npm run check:process

      - name: Run tests
        run: npm test

      - name: Lint encounter content
        run: npm run lint:encounter-content

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npx vite build
