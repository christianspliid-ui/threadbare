name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual full-suite run (THR-842). The path filter below is what keeps docs-only
  # pushes fast, and it is also why `main` can go a long stretch with no execution
  # of the required check at all — every orchestrator sweep and briefing refresh
  # is docs-only, so `Test · Typecheck · Build` records as `skipped`. That is
  # correct per-PR and useless for *retro-verification*: after an incident you
  # need one full gate run on a `main` commit, and before this trigger existed the
  # only way to force one was to invent a code change. Dispatching this workflow
  # on `main` runs the whole suite unconditionally — see the `detect` and `check`
  # conditions below for how the filter is bypassed.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# paths-filter reads the PR's changed-files list via the GitHub API, which
# needs pull-requests: read. The repo's default GITHUB_TOKEN is restricted,
# so grant it explicitly here (contents: read covers checkout + push-mode diff).
permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter-docs.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # Skipped on a manual dispatch (THR-842): paths-filter derives its diff
        # base from the push/pull_request payload, which a workflow_dispatch event
        # does not carry. Skipping the step leaves `code` empty and the job still
        # `success`, so the vacuous-gate guard below stays quiet — the `check`
        # job's own `workflow_dispatch` clause is what forces the full suite.
        if: github.event_name != 'workflow_dispatch'
        with:
          # 'code' is true if ANY changed file is not a doc.
          # predicate-quantifier: every is REQUIRED — under the default 'some'
          # (OR) quantifier the leading '**' matches every file, so the
          # negations never subtract and 'code' is always true (a doc-only PR
          # would still run the full suite). 'every' requires each file to
          # match '**' AND none of the negations, so only non-doc files qualify.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!Docs/**'
              - '!.planning/**'
              - '!Design/**'
              # Doc-sourced artifacts that land outside the doc paths (THR-922).
              # Both are generated FROM documentation but written to src/ or
              # public/, so without these two lines a UL-shard or canon-page edit
              # regenerates a non-doc file and the PR stops classifying as
              # docs-only — a pure documentation deliverable paying the full
              # ~15-minute code gate (measured on commit cc7a61ca).
              #
              # Excluding the ARTIFACT cannot weaken detection: a code source is
              # its own path and stays in the filter, so editing
              # scripts/interface-contracts.ts still yields code == 'true'. This
              # only stops the artifact manufacturing code-ness on a PR whose
              # real content is documentation. Their freshness guarantee is
              # unchanged — check:generated-freshness re-runs the whole prebuild
              # and, since THR-909, runs in the docs-check job below.
              #
              # Exact paths, never globs: the point is to exclude these two
              # artifacts, not to carve a hole in src/ or public/. The list is
              # mirrored by DOC_TO_CODE_ALLOWLIST in
              # scripts/generated-artifact-sources.ts, and
              # scripts/__tests__/docs-code-decoupling.test.ts fails if the two
              # ever disagree.
              - '!src/data/ul-dashboard.generated.json'
              - '!public/system-interface-map-reference.html'

      # A SECOND filter step, deliberately not merged into the one above (THR-909).
      # `predicate-quantifier` is a step-level input applying to every filter in
      # the step, and the two predicates need opposite quantifiers: `code` is
      # "some file matches ALL of (is-a-file, not-a-doc)", while `docs` is "some
      # file matches ANY of (md, Docs/, .planning/, Design/)". Expressing `docs`
      # under `every` would demand a single file be simultaneously *.md AND under
      # Docs/ AND under .planning/ — a predicate almost nothing satisfies, which
      # would read as a working filter and silently never fire.
      - uses: dorny/paths-filter@v3
        id: filter-docs
        # Same workflow_dispatch carve-out as above: no diff base on that event.
        if: github.event_name != 'workflow_dispatch'
        with:
          # Default quantifier ('some') is correct here — a file is a doc if it
          # matches any one of these.
          filters: |
            docs:
              - '**/*.md'
              - 'Docs/**'
              - '.planning/**'
              - 'Design/**'
              # The same two exclusions the `code` filter carries (THR-922), so
              # the two predicates stay complementary. Without these, a PR
              # touching ONLY a doc-sourced artifact — no shard, no canon page —
              # would read code == 'false' AND docs == 'false', and neither job
              # would run: the artifact would ship with no freshness check at
              # all. That shape should not occur (the artifact only changes when
              # its source does), but "should not occur" is what the skipped
              # required check said too (THR-768).
              - 'src/data/ul-dashboard.generated.json'
              - 'public/system-interface-map-reference.html'

  # The doc-validating gates, on the one PR shape that can trip them (THR-909).
  #
  # Three of the steps in `check` below exist purely to police documentation:
  # generated-artifact freshness (whose sources include `Docs/impediments.md` and
  # the UL shards), impediment-id uniqueness, and wiki freshness. They lived in a
  # job gated on `code == 'true'` — so on a documentation-only PR, the only kind
  # that can introduce a duplicate impediment id or a stale dashboard, all three
  # were skipped. Measured on PR #1096, which carried two rows with id `282` from
  # the moment it was authored and reported `Test · Typecheck · Build  skipping`;
  # and again on PR #1173, which documented the defect while demonstrating it.
  #
  # This is NOT the THR-768 case. There, `detect` *died* and the required check
  # recorded `skipped` while branch protection accepted it. Here `detect` succeeds
  # and `code == 'false'` is correct — the skip is working as designed. The defect
  # was upstream of that guard: doc gates placed in a code-gated job.
  #
  # Why `code != 'true'` rather than plain `docs == 'true'`: on a mixed PR the
  # `check` job below already runs all three gates, so firing this job too would
  # duplicate them on nearly every code PR (closeout commits almost always touch
  # `Docs/`). Exactly one of the two jobs runs the doc gates, never both, never
  # neither:
  #
  #   detect ok, docs-only PR       → this job runs the three gates
  #   detect ok, mixed or code-only → skipped; `check` runs them instead
  #   detect ok, nothing changed    → both skip (no PR has an empty diff)
  #   detect did NOT succeed        → skipped, and `check` fails loudly via its
  #                                   own guard, so the merge is blocked anyway
  #   event is workflow_dispatch    → skipped; `check` runs unconditionally
  #
  # Deliberately cheap: no full test suite, no typecheck, no vite build. It is
  # `npm ci` plus three fast scripts, which preserves the fast-docs-PR property
  # that made the original gating attractive.
  docs-check:
    name: Docs gates
    needs: detect
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.docs == 'true' && needs.detect.outputs.code != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 for the same reason as `check`: the wiki-freshness gate
      # diffs against origin/main and scans commit bodies for the exemption token.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so the most common failure surfaces fastest.
      - name: Impediment id uniqueness
        run: npm run check:impediment-ids

      - name: Generated artifact freshness
        run: npm run check:generated-freshness

      - name: Wiki freshness (blocking)
        run: |
          git fetch origin main
          npm run check:wiki-freshness:blocking

  check:
    name: Test · Typecheck · Build
    needs: detect
    # Three-way gate, not two (THR-768). The old condition was
    # `needs.detect.outputs.code == 'true'`, which conflated "nothing to check"
    # with "could not tell" — when `detect` died at startup the output was empty,
    # this job recorded as `skipped`, and **a skipped required check satisfies
    # branch protection**. The rule read as enforced and was void simultaneously;
    # measured end to end on PR #853 (2026-07-25) and PR #1022 (2026-07-28, which
    # carried engine + content changes).
    #
    #   event is push to main             → skip               (THR-939, see below)
    #   detect succeeded, code == 'true'  → run the suite      (unchanged)
    #   detect succeeded, code == 'false' → skip               (unchanged: docs-only PRs stay fast)
    #   detect did NOT succeed            → run, and FAIL loudly via the guard step below
    #   event is workflow_dispatch        → run unconditionally (THR-842 retro-verification)
    #
    # `!cancelled()` rather than `always()` deliberately: a run superseded by
    # `cancel-in-progress` must stay cancelled, not be reported as a failure.
    #
    # The `push` exclusion (THR-939). Branch protection runs in **strict mode** —
    # a branch must be up to date with `main` before it can merge — so the tree
    # that lands on `main` is byte-identical to the tree this job already
    # validated on the `pull_request` event minutes earlier. The post-merge run
    # re-derives a known answer.
    #
    # The reason to cut it is THROUGHPUT, not money. An earlier framing costed
    # these runs as ~22% of the CI bill; that premise is void — the repository is
    # public and every job here runs on `ubuntu-latest`, a standard runner, which
    # GitHub bills at $0 (audit: `Docs/audits/2026-08-01-ci-cost-and-wall-time.md`).
    # What the redundant run actually costs is a ~10-minute occupancy of the
    # Actions queue immediately after every merge, which delays the NEXT PR's
    # feedback. Under strict protection the merge ceiling is already one PR per
    # advance of `main`'s tip (THR-920), so anything lengthening the post-merge
    # window slows the lane directly.
    #
    # This does NOT touch the merge gate: the required `Test · Typecheck · Build`
    # status branch protection consumes is produced by the `pull_request` run on
    # the PR's head SHA. Nothing downstream reads a push-event conclusion.
    #
    # The clause is ANDed OUTSIDE the parenthesised group deliberately, so it also
    # suppresses the `detect.result != 'success'` guard path on push. That guard
    # exists to refuse a merge it cannot vouch for; on push the merge has already
    # happened and no gate is listening, so firing there would be an unactionable
    # red on `main` rather than a protection. On `pull_request` — where it is
    # load-bearing — it is untouched.
    #
    # `workflow_dispatch` is unaffected and becomes MORE load-bearing: it is now
    # the only way to execute the full suite against a `main` commit, which is
    # exactly the retro-verification path THR-842 added it for.
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || needs.detect.result != 'success' || needs.detect.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The vacuous-gate guard. If change detection did not succeed, this required
      # check has no idea whether the change is safe — and must say so in the only
      # way branch protection understands, which is a failing conclusion. Costs
      # ~10s on the (rare) path where it fires, and nothing at all otherwise.
      #
      # Note this guard is belt-and-braces during an Actions outage: when the
      # account budget is exhausted, THIS job also fails to start, which already
      # produces a `failure` conclusion. The guard is what covers every *other*
      # way `detect` can die — a paths-filter API error, a runner fault, a bad
      # token — none of which should ever be able to wave a change through.
      - name: Guard — change detection health
        if: needs.detect.result != 'success'
        run: |
          echo "::error::Change detection did not succeed (result='${{ needs.detect.result }}'). Refusing to report a pass — this required check cannot vouch for a change it never inspected. See THR-768."
          exit 1

      # fetch-depth: 0 gives the wiki-freshness gate (below) the history it needs
      # to diff against origin/main and to scan commit bodies for the exemption
      # token. The detect job stays shallow — it reads changed files via the API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Process lint (advisory)
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: npm run check:process

      - name: Run tests
        run: npm test

      - name: Lint encounter content
        run: npm run lint:encounter-content

      # `npx tsc --noEmit` used to live here and was a no-op: root tsconfig.json
      # sets `files: []`, so it exited 0 unconditionally no matter how broken the
      # code was — this required check asserted a type gate in its name while
      # containing none (THR-693). Bare `tsc -b` is not the fix either: the
      # baseline is ~3529 errors (THR-489), so it would turn the required check
      # red on arrival and block every PR. The ratchet fails only on an INCREASE.
      - name: Typecheck (ratchet)
        run: npm run check:typecheck

      # Generated artifacts (action catalog, UL dashboard, impediment dashboard)
      # are consumed at runtime but are NOT rebuilt by `vite build` — only by the
      # npm `prebuild` lifecycle hook, which `npx vite build` below bypasses. A
      # stale one therefore ships with no test failure and no build error; it
      # nearly leaked in two consecutive runs (THR-616, THR-663). This step
      # regenerates and fails if the commit's copies differ. Adds a few seconds.
      - name: Generated artifact freshness
        run: npm run check:generated-freshness

      # `Docs/impediments.md` is `merge=union` (THR-691) so concurrent appends from
      # different lanes merge without conflict — and union keeps BOTH sides of a
      # conflicting hunk, which is right for the rows and wrong for their hand-assigned
      # numbers. The freshness gate above only proves the dashboard matches its source,
      # never that the source's keys are distinct, so a duplicate regenerates cleanly
      # and ships green; 15 had accumulated undetected (THR-881). This step is what
      # stops the second lane's PR from landing a number `main` already uses.
      - name: Impediment id uniqueness
        run: npm run check:impediment-ids

      # Blocking wiki-freshness gate (THR-730, user verdict 2026-07-23). Fails the
      # required check if a PR changes a file matched by a wiki page's `sources`
      # without updating that page/payload — unless a commit body carries
      # `Wiki-freshness-exempt: <reason>`. On a push-to-main event the diff base
      # equals HEAD, so the diff is empty and the step is inert. `git fetch` is a
      # cheap idempotent guard on top of the checkout's fetch-depth: 0.
      - name: Wiki freshness (blocking)
        run: |
          git fetch origin main
          npm run check:wiki-freshness:blocking

      - name: Production build
        run: npx vite build
