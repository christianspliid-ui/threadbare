name: Flush Close-Keyword Guard

# THR-535: deterministic backstop for the plan-doc flush → false auto-close bug (recurred 4×:
# THR-501, THR-519, THR-525, plus the 2026-06-26 batch).
#
# GitHub's NATIVE Linear integration closes an issue whenever a merged PR's title/body/branch
# carries `Closes|Fixes|Resolves THR-NNN` (or the equivalent Linear issue URL) — regardless of
# our custom linear-autoclose.yml docs-flush exemption. The only thing that stops a plan-doc
# flush PR from sweeping its whole batch to Done is the ABSENCE of that keyword, a text convention
# in flush-plan-docs/SKILL.md that has drifted and regressed repeatedly (most recently the Step
# 2f.4 fallback template emitting `Closes <issue-url>`, which closed THR-525).
#
# This BLOCKING check fails any flush-pattern PR that carries a closing keyword, so the merge
# never happens and the native integration never fires. It complements THR-534 (which fixes the
# current template at source): the template fix stops the CURRENT leak; this guard stops the NEXT
# template regression from reaching main. Match logic is single-sourced in the unit-tested helper
# scripts/linearAutoclose.mjs (evaluateFlushCloseGuard) so it stays consistent with the auto-close
# action's own docs-flush detection.
#
# `edited` is in the trigger list so re-running the check after fixing the PR body clears it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Block flush PRs carrying close keywords
    runs-on: ubuntu-latest
    steps:
      # Checkout so the inline script can import the shared, unit-tested helper.
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { evaluateFlushCloseGuard } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/linearAutoclose.mjs`);

            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No pull_request in payload — nothing to guard');
              return;
            }

            // The native Linear integration also reads the PR's commit messages, so scan them too.
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const commitMessages = commits.map(c => c.commit.message);

            const verdict = evaluateFlushCloseGuard({
              branch: pr.head?.ref,
              title: pr.title,
              body: pr.body,
              commitMessages,
            });

            console.log(JSON.stringify({
              type: 'flush-close-guard.verdict',
              branch: pr.head?.ref,
              title: pr.title,
              ...verdict,
            }));

            if (!verdict.isFlush) {
              console.log(`✅ Not a docs-flush PR (branch "${pr.head?.ref}" / title "${pr.title}") — guard does not apply.`);
              return;
            }

            if (verdict.blocked) {
              const ids = verdict.offendingIds.join(', ');
              const plural = verdict.offendingIds.length === 1 ? 'this issue' : 'these issues';
              core.setFailed(
                `❌ This plan-doc flush PR carries issue-closing keyword(s) for: ${ids}. ` +
                `Flush PRs commit a design doc only — they never resolve the issue. ` +
                `GitHub's native Linear integration would falsely close ${plural} on merge (THR-535). ` +
                `Remove the closing keyword(s) from the PR body/commits — reference the issue as a bare ` +
                `THR-NNN token or a plain (keyword-free) URL instead. See flush-plan-docs/SKILL.md Step 2f.4.`
              );
              return;
            }

            console.log('✅ Docs-flush PR with no closing keywords — safe to merge.');
