name: Weekly Drift Scan

on:
  schedule:
    # Fridays at 14:00 UTC (~1 hour before the retro slot)
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Drift scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore most recent baseline snapshot. Unique key guarantees each run
      # writes a new snapshot while restore-keys pulls the previous one.
      - name: Restore baseline cache
        uses: actions/cache@v4
        with:
          path: drift-scan-baseline.json
          key: drift-scan-baseline-${{ github.run_id }}
          restore-keys: |
            drift-scan-baseline-

      - name: Run drift scan
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRIFT_SCAN_BASELINE_PATH: drift-scan-baseline.json
          OBSIDIAN_VAULT_PATH: ${{ secrets.OBSIDIAN_VAULT_PATH }}
        run: node --experimental-strip-types scripts/drift-scan/index.ts

      - name: Upload baseline snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-scan-baseline
          path: drift-scan-baseline.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test output artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-scan-test-results
          path: .cache/drift-scan-results.json
          retention-days: 30
          if-no-files-found: ignore
