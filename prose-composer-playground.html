<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prose Composer Playground — The Fantasy World Simulator</title>
<style>
  :root {
    --bg: #1a1a1e;
    --bg-surface: #24242a;
    --bg-elevated: #2e2e36;
    --bg-input: #1e1e24;
    --border: #3a3a44;
    --border-focus: #7a6a50;
    --text: #d4cfc6;
    --text-dim: #8a8578;
    --text-bright: #ede8df;
    --accent: #b8956a;
    --accent-dim: #7a6a50;
    --origin: #c49a6c;
    --atmosphere: #6a8fa0;
    --character: #8a7aaa;
    --tension: #aa6a6a;
    --history: #6aaa7a;
    --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-prose: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    gap: 0;
  }

  /* ─── Header ─── */
  header {
    grid-column: 1 / -1;
    padding: 16px 24px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.02em;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ─── Controls Panel ─── */
  .controls {
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 0;
  }
  .control-section {
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .control-section h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  select, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: var(--font-ui);
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--border-focus);
  }

  textarea {
    width: 100%;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--font-prose);
    line-height: 1.6;
    resize: vertical;
    margin-bottom: 8px;
    min-height: 80px;
  }

  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .preset-btn {
    background: var(--bg-elevated);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover {
    color: var(--text);
    border-color: var(--accent-dim);
  }
  .preset-btn.active {
    background: var(--accent-dim);
    color: var(--text-bright);
    border-color: var(--accent);
  }

  /* ─── Layer cards in controls ─── */
  .layer-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .layer-card .layer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .layer-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
  }
  .layer-badge.origin { background: var(--origin); }
  .layer-badge.atmosphere { background: var(--atmosphere); }
  .layer-badge.character { background: var(--character); }
  .layer-badge.tension { background: var(--tension); }
  .layer-badge.history { background: var(--history); }

  .layer-priority {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  .layer-source {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .layer-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .layer-toggle input[type="checkbox"] {
    accent-color: var(--accent);
  }
  .layer-toggle label {
    margin: 0;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }

  .template-select {
    width: 100%;
    margin-bottom: 0;
  }

  /* ─── Preview Panel ─── */
  .preview-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .preview-tabs {
    display: flex;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }
  .preview-tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .preview-tab:hover { color: var(--text); }
  .preview-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .preview-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }

  .mode-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .prose-output {
    font-family: var(--font-prose);
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-bright);
    max-width: 640px;
  }
  .prose-output p {
    margin-bottom: 16px;
  }
  .prose-output p:last-child {
    margin-bottom: 0;
  }

  .prose-output .layer-highlight {
    position: relative;
    border-left: 3px solid transparent;
    padding-left: 12px;
    margin-left: -15px;
    transition: all 0.2s;
  }
  .prose-output .layer-highlight:hover {
    background: rgba(255,255,255,0.03);
  }
  .prose-output .layer-highlight.cat-origin { border-left-color: var(--origin); }
  .prose-output .layer-highlight.cat-atmosphere { border-left-color: var(--atmosphere); }
  .prose-output .layer-highlight.cat-character { border-left-color: var(--character); }
  .prose-output .layer-highlight.cat-tension { border-left-color: var(--tension); }
  .prose-output .layer-highlight.cat-history { border-left-color: var(--history); }

  .layer-inline-tag {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
    color: #fff;
    opacity: 0.7;
  }

  .summary-output {
    font-family: var(--font-prose);
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    max-width: 500px;
    padding: 12px 16px;
    background: var(--bg-elevated);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .char-count {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: var(--font-mono);
  }

  /* Pipeline view */
  .pipeline-step {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .pipeline-step h4 {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .pipeline-step .step-detail {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    line-height: 1.6;
  }
  .pipeline-arrow {
    text-align: center;
    color: var(--text-dim);
    font-size: 16px;
    margin: 4px 0;
  }

  /* Category cap visualization */
  .cap-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .cap-cell {
    text-align: center;
    font-size: 10px;
    padding: 6px 4px;
    border-radius: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
  }
  .cap-cell .cap-name {
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .cap-cell .cap-count {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  /* ─── Output bar ─── */
  .output-bar {
    grid-column: 1 / -1;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .output-bar .output-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .output-prompt {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    line-height: 1.5;
    max-height: 80px;
    overflow-y: auto;
  }
  .copy-btn {
    background: var(--accent-dim);
    color: var(--text-bright);
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: var(--accent); }
  .copy-btn.copied {
    background: var(--history);
  }

  /* ─── Custom fragment editor ─── */
  .custom-editor {
    margin-top: 8px;
  }
  .custom-editor textarea {
    font-size: 12px;
    min-height: 60px;
  }
  .add-fragment-btn {
    background: var(--bg-elevated);
    color: var(--accent);
    border: 1px dashed var(--accent-dim);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
  }
  .add-fragment-btn:hover {
    background: var(--accent-dim);
    color: var(--text-bright);
    border-style: solid;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: var(--tension); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<div class="layout">
  <header>
    <h1>Prose Composer Playground</h1>
    <span class="subtitle">Interactive content authoring for the prose generator framework</span>
  </header>

  <div class="controls" id="controls">
    <!-- Presets -->
    <div class="control-section">
      <h3>Location Presets</h3>
      <div class="preset-row" id="presets"></div>
    </div>

    <!-- Entity Config -->
    <div class="control-section">
      <h3>Location Properties</h3>
      <label for="locName">Name</label>
      <input type="text" id="locName" value="Ashenveil">
      <label for="locSubtype">Subtype</label>
      <select id="locSubtype"></select>
      <label for="locTerrain">Terrain / Biome</label>
      <select id="locTerrain"></select>
      <label for="locCulture">Culture (foundation pair)</label>
      <select id="locCulture"></select>
      <label for="locSphere">Dominant Sphere</label>
      <select id="locSphere"></select>
      <label for="locFaction">Controlling Faction</label>
      <input type="text" id="locFaction" value="">
      <label for="locAgent1">Notable Inhabitant</label>
      <input type="text" id="locAgent1" value="">
      <label for="locArchetype1">Archetype</label>
      <select id="locArchetype1"></select>
    </div>

    <!-- Compose Settings -->
    <div class="control-section">
      <h3>Compose Settings</h3>
      <label for="seed">PRNG Seed</label>
      <input type="number" id="seed" value="42" min="0" max="999999">
      <label for="maxPerCat">Max layers per category</label>
      <input type="number" id="maxPerCat" value="2" min="1" max="5">
    </div>

    <!-- Resolved Layers -->
    <div class="control-section">
      <h3>Resolved Layers</h3>
      <p style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">
        Toggle layers on/off, swap templates, or edit text. Changes update the preview instantly.
      </p>
      <div id="layerCards"></div>
    </div>

    <!-- Custom Fragment -->
    <div class="control-section">
      <h3>Add Custom Fragment</h3>
      <label for="customCat">Category</label>
      <select id="customCat">
        <option value="origin">origin</option>
        <option value="atmosphere">atmosphere</option>
        <option value="character">character</option>
        <option value="tension">tension</option>
        <option value="history">history</option>
      </select>
      <label for="customPriority">Priority</label>
      <input type="number" id="customPriority" value="50" min="1" max="100">
      <label for="customText">Prose fragment</label>
      <textarea id="customText" placeholder="Write a prose fragment... Use {name} for location name, {faction} for faction."></textarea>
      <button class="add-fragment-btn" onclick="addCustomFragment()">+ Add Fragment</button>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-tabs">
      <button class="preview-tab active" data-tab="full" onclick="switchTab('full')">Full Mode</button>
      <button class="preview-tab" data-tab="summary" onclick="switchTab('summary')">Summary Mode</button>
      <button class="preview-tab" data-tab="pipeline" onclick="switchTab('pipeline')">Pipeline View</button>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>

  <div class="output-bar">
    <span class="output-label">Prompt</span>
    <div class="output-prompt" id="outputPrompt"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA — subset of prose-layer-content.ts
// ═══════════════════════════════════════════════════════════════

const BIOME_PROSE = {
  grassland: [
    'The grasslands stretch empty and honest beneath a low sky, each blade worn grey by wind. No shelter here, only the rhythm of seasons turning to dust.',
    'Grasses sway in patterns that suggest meaning \u2014 a language the wind speaks and the earth forgets. The horizon bleeds into overcast without border or mercy.',
    'Open country where the eye finds no rest. The grass is pale and brittle, marked by hoofprints that fill with shadow.',
  ],
  farmland: [
    'Tilled earth in neat desperation \u2014 rows where survivors once fought the soil for bread. The fields lie half-fallow now, memory of labor soaked into furrowed ground.',

  ],
  swamp: [
    'Water and earth cannot decide which is dominant, so the swamp exists in neither state. Mist rises in coils as if the ground itself is breathing in shallow gasps.',

  mountains: [

  tundra: [

  coast: [

function mulberry32(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickTemplate(templates, seed) {
  if (!templates || templates.length === 0) return undefined;
  const rng = mulberry32(seed);
  return templates[Math.floor(rng() * templates.length)];
}

function replacePlaceholders(text, replacements) {
  let result = text;
  for (const [key, value] of Object.entries(replacements)) {
    result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);
  }
  return result;
}

function resolveAllLayers() {
  const layers = [];
  let id = 0;
  const s = state.seed;

  // subtypeResolver
  if (state.locSubtype && SUBTYPE_ESTABLISHING_PROSE[state.locSubtype]) {
    const templates = SUBTYPE_ESTABLISHING_PROSE[state.locSubtype];
    const text = replacePlaceholders(pickTemplate(templates, s) || '', { name: state.locName });
    layers.push({ id: id++, enabled: true, category: 'origin', priority: 100, source: 'subtypeResolver', text, templateIndex: templates.indexOf(text.replace(new RegExp(state.locName, 'g'), '{name}')), templates: templates.map(t => replacePlaceholders(t, { name: state.locName })), rawTemplates: templates });
  }

  // biomeResolver
  if (state.locTerrain && BIOME_PROSE[state.locTerrain]) {
    const templates = BIOME_PROSE[state.locTerrain];
    const text = pickTemplate(templates, s + 1) || '';
    layers.push({ id: id++, enabled: true, category: 'atmosphere', priority: 90, source: 'biomeResolver', text, templateIndex: templates.indexOf(text), templates, rawTemplates: templates });
  }

  // cultureResolver
  if (state.locCulture && CULTURE_LOCATION_PROSE[state.locCulture]) {
    const templates = CULTURE_LOCATION_PROSE[state.locCulture];
    const text = pickTemplate(templates, s + 2) || '';
    layers.push({ id: id++, enabled: true, category: 'character', priority: 80, source: 'cultureResolver', text, templateIndex: templates.indexOf(text), templates, rawTemplates: templates });
  }

  // sphereResolver
  if (state.locSphere && SPHERE_LOCATION_PROSE[state.locSphere]) {
    const templates = SPHERE_LOCATION_PROSE[state.locSphere];
    const text = pickTemplate(templates, s + 3) || '';
    layers.push({ id: id++, enabled: true, category: 'atmosphere', priority: 70, source: 'sphereResolver', text, templateIndex: templates.indexOf(text), templates, rawTemplates: templates });
  }

  // factionResolver
  if (state.locFaction) {
    const templates = FACTION_CONTROL_PROSE;
    const text = replacePlaceholders(pickTemplate(templates, s + 4) || '', { faction: state.locFaction });
    layers.push({ id: id++, enabled: true, category: 'character', priority: 60, source: 'factionResolver', text, templateIndex: -1, templates: templates.map(t => replacePlaceholders(t, { faction: state.locFaction })), rawTemplates: templates });
  }

  // populationResolver
  if (state.locAgent1) {
    const templates = POPULATION_PROSE_TEMPLATES;
    const text = replacePlaceholders(pickTemplate(templates, s + 5) || '', { agent: state.locAgent1, archetype: state.locArchetype1 || 'wanderer' });
    layers.push({ id: id++, enabled: true, category: 'character', priority: 50, source: 'populationResolver', text, templateIndex: -1, templates: templates.map(t => replacePlaceholders(t, { agent: state.locAgent1, archetype: state.locArchetype1 || 'wanderer' })), rawTemplates: templates });
  }

  resolvedLayers = layers;
}

function composeFull() {
  const allLayers = [...resolvedLayers.filter(l => l.enabled), ...customLayers.filter(l => l.enabled)];
  const sorted = allLayers.sort((a, b) => b.priority - a.priority);
  const categoryCounts = {};
  const selected = [];
  for (const layer of sorted) {
    if (selected.length >= 6) break;
    const count = categoryCounts[layer.category] || 0;
    if (count >= state.maxPerCat) continue;
    selected.push(layer);
    categoryCounts[layer.category] = count + 1;
  }
  return selected;
}

function composeSummary() {
  const allLayers = [...resolvedLayers.filter(l => l.enabled), ...customLayers.filter(l => l.enabled)];
  if (allLayers.length === 0) return '';
  const sorted = allLayers.sort((a, b) => b.priority - a.priority);
  const text = sorted[0].text;
  return text.length <= 200 ? text : text.slice(0, 200) + '...';
}

function updatePrompt() {
  const parts = [];

  if (state.locName !== DEFAULTS.locName) parts.push(`location named "${state.locName}"`);
  if (state.locSubtype !== DEFAULTS.locSubtype) parts.push(`subtype: ${state.locSubtype.replace(/_/g, ' ')}`);
  if (state.locTerrain !== DEFAULTS.locTerrain) parts.push(`terrain: ${state.locTerrain.replace(/_/g, ' ')}`);
  if (state.locCulture !== DEFAULTS.locCulture) parts.push(`culture: ${state.locCulture.replace(/_/g, ' + ')}`);
  if (state.locSphere !== DEFAULTS.locSphere) parts.push(`sphere: ${state.locSphere}`);
  if (state.locFaction && state.locFaction !== DEFAULTS.locFaction) parts.push(`faction: ${state.locFaction}`);

  const disabled = resolvedLayers.filter(l => !l.enabled);
  if (disabled.length > 0) parts.push(`disabled resolvers: ${disabled.map(l => l.source).join(', ')}`);

  const swapped = resolvedLayers.filter(l => {
    const original = pickTemplate(l.rawTemplates || [], state.seed + l.id);
    return l.text !== original && l.text !== replacePlaceholders(original || '', { name: state.locName, faction: state.locFaction });
  });
  if (swapped.length > 0) parts.push(`swapped templates in: ${swapped.map(l => l.source).join(', ')}`);

  if (customLayers.length > 0) parts.push(`${customLayers.length} custom fragment(s) added`);

  if (state.maxPerCat !== 2) parts.push(`max ${state.maxPerCat} layers per category`);

  const selected = composeFull();
  const prompt = parts.length > 0
    ? `Generate a location description with: ${parts.join('; ')}. The composed output has ${selected.length} paragraphs across categories: ${[...new Set(selected.map(l => l.category))].join(', ')}.`
    : `Generate a location description using default settings (${state.locSubtype} in ${state.locTerrain.replace(/_/g, ' ')}).`;

  document.getElementById('outputPrompt').textContent = prompt;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.preview-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderPreview();
}

function addCustomFragment() {
  const cat = document.getElementById('customCat').value;
  const priority = parseInt(document.getElementById('customPriority').value) || 50;
  const rawText = document.getElementById('customText').value.trim();
  if (!rawText) return;

  const text = replacePlaceholders(rawText, { name: state.locName, faction: state.locFaction });

  customLayers.push({
    id: nextCustomId++,
    enabled: true,
    category: cat,
    priority,
    source: 'custom',
    text,
    templates: null,
    rawTemplates: null,
  });

  document.getElementById('customText').value = '';
  updateAll();
}

function copyPrompt() {
  const text = document.getElementById('outputPrompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// ═══════════════════════════════════════════════════════════════
// WIRING
// ═══════════════════════════════════════════════════════════════

function updateAll() {
  resolveAllLayers();
  renderLayerCards();
  renderPreview();
}

function bindControls() {
  const fields = ['locName','locSubtype','locTerrain','locCulture','locSphere','locFaction','locAgent1','locArchetype1','seed','maxPerCat'];
  fields.forEach(field => {
    const el = document.getElementById(field);
    el.addEventListener('input', () => {
      if (field === 'seed' || field === 'maxPerCat') {
        state[field] = parseInt(el.value) || 0;
      } else {
        state[field] = el.value;
      }
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      updateAll();
    });
  });
}

// ─── Init ───
populateSelects();
renderPresets();
bindControls();
updateAll();
</script>
</body>
</html>
