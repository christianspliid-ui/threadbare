<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Threadbearer · Encounter UI — three under-specified moments</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html,body { margin:0; background:#f0eee9; }
  /* The design-system tokens.css restyles html/body to dark — override for the canvas page itself. */
  body { background:#f0eee9 !important; color:#2a251f; font-family: var(--font-body); }
  /* Each artboard is its own dark world — let it set its own bg. */
  .tb-stage {
    background: var(--bg-abyss);
    color: var(--text-primary);
    font-family: var(--font-body);
    width: 100%; height: 100%;
    overflow: hidden;
    position: relative;
  }
  .tb-stage *::selection { background: var(--accent-gold-glow); }

  /* Threadbearer-specific reused classes (kept here so per-component files stay small) */
  .label { font-family: var(--font-display); font-size: 14px; letter-spacing: .14em;
           text-transform: uppercase; color: var(--text-tertiary); }
  .gold-label { color: var(--accent-gold); }
  .display { font-family: var(--font-display); letter-spacing: .04em; color: var(--text-primary); font-weight: 600; }
  .prose { font-family: var(--font-body); color: var(--text-secondary); line-height: 1.7; font-size: 17px; }
  .flavor { font-family: var(--font-body); font-style: italic; color: var(--text-secondary); line-height: 1.65; }
  .panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; }
  .panel.gold { border: 1px solid var(--border-accent); }
  .hairline { height:1px; background: var(--border-subtle); }
  .gold-bar { height:1px; width: 56px; background: var(--accent-gold); }

  /* — moment-1 thread animation — */
  @keyframes thrum-fade { 0% { opacity:0 } 12% { opacity:.85 } 100% { opacity:.3 } }
  @keyframes thread-draw { from { stroke-dashoffset: 600 } to { stroke-dashoffset: 0 } }
  @keyframes mote-drift  { 0% { transform: translate(0,0); opacity:0 }
                           20% { opacity:1 }
                           100% { transform: translate(var(--mx,0), var(--my,0)); opacity:0 } }
  @keyframes pull-taut   { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(1.02) } }
  @keyframes hold-glow   { 0%,100% { filter: drop-shadow(0 0 6px currentColor) }
                           50%     { filter: drop-shadow(0 0 12px currentColor) } }

  /* — moment-2 effect-card flip — */
  @keyframes card-flip-in {
    0%   { opacity:0; transform: rotateX(80deg) translateY(-6px); filter: brightness(.6); }
    60%  { opacity:1; transform: rotateX(-6deg) translateY(0);    filter: brightness(1.15); }
    100% { opacity:1; transform: rotateX(0)    translateY(0);    filter: brightness(1); }
  }
  @keyframes mark-pulse  { 0%,100% { box-shadow: 0 0 0 0 var(--mark-color, var(--accent-gold-dim)); }
                           50%     { box-shadow: 0 0 22px 1px var(--mark-color, var(--accent-gold-dim)); } }

  /* breadcrumb dot */
  .crumb-dot { width:4px; height:4px; border-radius:99px; background: var(--text-muted); display:inline-block; }

  /* dotted-underline term */
  .term { color: var(--text-secondary); border-bottom: 1px dotted var(--accent-gold-dim); cursor: pointer; }
  .term:hover { color: var(--accent-gold); }

  /* selection ring used by reveal storyboard */
  .ring-iron { box-shadow: 0 0 0 1px var(--sphere-force-bright) inset, 0 0 18px -2px var(--sphere-force-bright); }
  .ring-eye  { box-shadow: 0 0 0 1px var(--sphere-mind-bright) inset,  0 0 18px -2px var(--sphere-mind-bright); }
  .ring-heart{ box-shadow: 0 0 0 1px var(--sphere-spirit-bright) inset,0 0 18px -2px var(--sphere-spirit-bright); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="parts/encounter-shell.jsx"></script>
<script type="text/babel" src="parts/moment1-reveal.jsx"></script>
<script type="text/babel" src="parts/moment2-aftermath.jsx"></script>
<script type="text/babel" src="parts/moment3-detail.jsx"></script>
<script type="text/babel" src="parts/app.jsx"></script>
</body>
</html>
